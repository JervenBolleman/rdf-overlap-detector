name: native-check

# Builds the native binary on arm64 Linux and runs the release smoke test against it. The release workflow builds
# every platform; this one catches native breakage on each change, on the platform where it is cheapest to check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build the native binary
        shell: bash
        run: mvn -B -Pnative -DskipTests package

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="target/rdf-overlap-detector"
          "$BIN" help
          # The .zst sample exercises the zstd native library, which both reads and writes zstd. The run merge reads the
          # zstd runs back, so it covers both directions.
          OUT="$RUNNER_TEMP/smoke-out"
          "$BIN" extract src/test/resources/samples/sample.nt.zst "$OUT" | tee "$RUNNER_TEMP/smoke.txt"
          grep -q 'statements=3' "$RUNNER_TEMP/smoke.txt"
          # The whole sample directory: every syntax and compression, and one file that is not RDF at all.
          "$BIN" extract src/test/resources/samples "$RUNNER_TEMP/smoke-dir" | tee "$RUNNER_TEMP/smoke-dir.txt"
          grep -q 'files=17' "$RUNNER_TEMP/smoke-dir.txt"
